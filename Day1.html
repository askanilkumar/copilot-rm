<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce Copilot Quest · Day 1</title>
<meta name="description" content="Interactive, gamified companion to Day 1 of the Copilot for Resource Management and Global Mobility program.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EAEFF8; --ink:#14203A; --muted:#58657E; --line:#D6DDEA;
  --accent:#2F5BEA; --accent-soft:#E2E9FE; --accent-ink:#FFFFFF;
  --good:#0E8C7B; --good-soft:#DDF4EF; --bad:#C8413F; --bad-soft:#FBE6E5;
  --gold:#C98A06; --gold-soft:#FDF1D4;
  --r:#7549D4; --r-soft:#EEE7FD; --t:#2F5BEA; --t-soft:#E2E9FE; --c:#0E8C7B; --c-soft:#DDF4EF; --f:#C47A0A; --f-soft:#FDEFD6;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 6px 20px rgba(20,32,58,.06);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1321; --surface:#151D2F; --surface-2:#1C2640; --ink:#E5EAF4; --muted:#9BA7BE; --line:#2A3551;
  --accent:#7390FF; --accent-soft:#1F2B55; --accent-ink:#0D1321;
  --good:#3CC5AE; --good-soft:#123A36; --bad:#F07A77; --bad-soft:#3F1D22;
  --gold:#F2B83A; --gold-soft:#3A2E12;
  --r:#AE8CFF; --r-soft:#2B2250; --t:#7390FF; --t-soft:#1F2B55; --c:#3CC5AE; --c-soft:#123A36; --f:#F2B04A; --f-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1321; --surface:#151D2F; --surface-2:#1C2640; --ink:#E5EAF4; --muted:#9BA7BE; --line:#2A3551;
  --accent:#7390FF; --accent-soft:#1F2B55; --accent-ink:#0D1321;
  --good:#3CC5AE; --good-soft:#123A36; --bad:#F07A77; --bad-soft:#3F1D22;
  --gold:#F2B83A; --gold-soft:#3A2E12;
  --r:#AE8CFF; --r-soft:#2B2250; --t:#7390FF; --t-soft:#1F2B55; --c:#3CC5AE; --c-soft:#123A36; --f:#F2B04A; --f-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;margin:0}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.ph:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-inline:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo{display:grid;grid-template-columns:repeat(2,11px);gap:3px;flex:none}
.logo i{width:11px;height:11px;border-radius:3px}
.logo i:nth-child(1){background:var(--r)}.logo i:nth-child(2){background:var(--t)}.logo i:nth-child(3){background:var(--c)}.logo i:nth-child(4){background:var(--f)}
.brand b{font-family:var(--display);font-size:18px;font-weight:800;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.meter{flex:1;display:flex;align-items:center;gap:14px;justify-content:flex-end;min-width:0}
.lvl{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px;white-space:nowrap}
.lvl .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-family:var(--display)}
.bar{flex:1;max-width:260px;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gold),#E9B53B);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpt{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;color:var(--muted)}
.xpt b{font-family:var(--display);font-size:22px;color:var(--gold);margin-right:2px}
.xpt.bump b{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .k{font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:1px 6px}
@media (max-width:760px){
  .hud-in{flex-wrap:wrap;gap:8px 12px}
  .brand small{display:none}
  .meter{flex-basis:100%;justify-content:space-between}
  .bar{max-width:none}
  .lvl .nm{display:none}
}

main{padding-block:28px 64px}
section.page{display:grid;gap:34px}
.sec-h{display:grid;gap:6px;max-width:70ch}
.sec-h h2{font-size:clamp(24px,3.2vw,32px);font-weight:800}
.sec-h p{color:var(--muted)}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,54px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--r),var(--t) 40%,var(--c) 70%,var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:17px;color:var(--muted);margin-top:14px;max-width:48ch}
.howxp{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--line)}
.pill b{color:var(--gold)}
.rtcf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rt{--k:var(--t);--ks:var(--t-soft);text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:6px;align-content:start;min-height:150px;position:relative;transition:transform .15s,border-color .15s}
.rt:hover{transform:translateY(-2px);border-color:var(--k)}
.rt .big{font-family:var(--display);font-size:40px;font-weight:800;color:var(--k);line-height:1}
.rt .nm{font-weight:700;font-size:16px}
.rt .q{color:var(--muted);font-size:14px}
.rt .more{display:none;font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.rt .more .ex{font-family:var(--mono);font-size:12.5px;background:var(--ks);color:var(--ink);border-radius:8px;padding:6px 8px;display:block;margin-bottom:6px}
.rt.open{background:var(--ks);border-color:var(--k)}
.rt.open .more{display:block}
.rt .hint{position:absolute;top:14px;right:14px;font-size:11px;color:var(--muted)}
.rt.open .hint{display:none}
.rt[data-k="r"]{--k:var(--r);--ks:var(--r-soft)}.rt[data-k="c"]{--k:var(--c);--ks:var(--c-soft)}.rt[data-k="f"]{--k:var(--f);--ks:var(--f-soft)}
.rt.open .more .ex{background:var(--surface)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}

/* ---------- Cards / blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.tight{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.compare{display:grid;gap:14px}
.compare-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.colored{font-family:var(--mono);font-size:13.5px;line-height:1.75;background:var(--surface-2);border-radius:12px;padding:16px;white-space:pre-wrap}
.colored span{border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cr{background:var(--r-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--r)}.ct{background:var(--t-soft);box-shadow:inset 0 -2px 0 var(--t)}.cc{background:var(--c-soft);box-shadow:inset 0 -2px 0 var(--c)}.cf{background:var(--f-soft);box-shadow:inset 0 -2px 0 var(--f)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px}
.outcome{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.outcome div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px}
.outcome b{display:block;font-family:var(--display);font-size:22px}
.outcome .up b{color:var(--good)}.outcome .dn b{color:var(--bad)}
@media (max-width:640px){.outcome{grid-template-columns:1fr 1fr}}

/* ---------- Questions ---------- */
.q{display:grid;gap:12px;align-content:start}
.q-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.q-h .t{font-weight:700;font-size:15.5px}
.xpb{flex:none;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.q.solved .xpb{color:var(--good);background:var(--good-soft)}
.q .kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q .stem-code{font-family:var(--mono);font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{font-size:14px;border-radius:10px;padding:10px 12px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:0}
.fb.no{background:var(--bad-soft)}
.fb b{font-weight:700}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;border-radius:10px;padding:9px 16px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tagrow{display:grid;gap:8px}
.tagitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;font-size:14px}
.tagitem.right{border-color:var(--good);background:var(--good-soft)}
.tagitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tagbtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tb{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;padding:4px 8px;font-weight:700;font-size:12.5px}
.tb[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--accent)}
.tb[data-v="R"][aria-pressed="true"]{background:var(--r)}.tb[data-v="T"][aria-pressed="true"]{background:var(--t)}.tb[data-v="C"][aria-pressed="true"]{background:var(--c)}.tb[data-v="F"][aria-pressed="true"]{background:var(--f)}
.tb[data-v="Safe"][aria-pressed="true"]{background:var(--good)}.tb[data-v="Never"][aria-pressed="true"]{background:var(--bad)}
@media (max-width:560px){.tagitem{grid-template-columns:1fr}.tagbtns{justify-content:flex-start}}
.ord{display:grid;gap:10px}
.ord-lane{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start}
.ord-lane:empty::before{content:attr(data-empty);color:var(--muted);font-size:13px;padding:6px}
.chipb{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;gap:8px}
.chipb .no{font-weight:800;color:var(--accent);font-family:var(--display)}
.chipb.right{border-color:var(--good);background:var(--good-soft)}
.chipb.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chk{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.chk.right{border-color:var(--good);background:var(--good-soft)}
.chk.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* ---------- Prompt types ---------- */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ty{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px;align-content:start;transition:border-color .12s,transform .12s}
.ty:hover{transform:translateY(-2px);border-color:var(--accent)}
.ty[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ty .ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.ty[aria-selected="true"] .ico{background:var(--surface)}
.ty b{font-size:15px}
.ty small{color:var(--muted);font-size:12.5px;line-height:1.35}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--good)}
.tdetail{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tdetail h3{font-size:26px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface-2)}
.tryit{background:var(--good-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.tryit ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.watch{font-size:14px;background:var(--gold-soft);border-radius:10px;padding:10px 12px}
.watch b{color:var(--gold)}
@media (max-width:860px){.tdetail{grid-template-columns:1fr}}

/* ---------- Prompt blocks ---------- */
.pbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.pbar .eyebrow{font-size:10.5px}
.prompt{font-family:var(--mono);font-size:13.3px;line-height:1.7;white-space:pre-wrap;padding:14px;overflow-wrap:anywhere}
.ph{background:var(--gold-soft);border-bottom:1.5px dashed var(--gold);border-radius:4px;padding:0 3px;outline:none;cursor:text}
.ph.filled{background:var(--good-soft);border-bottom:1.5px solid var(--good)}
.fu{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fu .lab{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.fuchip{border:1px dashed var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:13px;text-align:left}
.fuchip:hover{background:var(--accent-soft)}
.note{font-size:14px;background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;gap:8px}
.note.warn{background:var(--gold-soft)}
.note svg{flex:none;margin-top:2px}

/* ---------- Modules ---------- */
.timeline{display:flex;gap:3px;border-radius:14px;overflow:hidden}
.tl{border:0;padding:10px 8px;background:var(--surface);text-align:left;display:grid;gap:2px;min-width:0;position:relative;border-top:4px solid var(--line)}
.tl span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl b{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl.brk{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,var(--surface-2) 6px,var(--surface-2) 12px);cursor:default}
.tl.done{border-top-color:var(--good)}
.tl[aria-current="true"]{border-top-color:var(--accent);background:var(--accent-soft)}
.tl .ck{position:absolute;top:8px;right:6px;color:var(--good)}
@media (max-width:760px){.tl span{display:none}.tl b{font-size:12.5px}.tl{padding:8px 4px}}
.mod-h{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.mod-h h2{font-size:clamp(26px,3.6vw,38px);font-weight:800}
.mod-h .time{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.mod-h .oc{color:var(--muted);max-width:62ch;margin-top:8px}
@media (max-width:700px){.mod-h{grid-template-columns:1fr}}
details.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.ex>summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
details.ex>summary::-webkit-details-marker{display:none}
details.ex .num{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:4px 8px}
details.ex .st b{display:block;font-size:16px}
details.ex .st small{color:var(--muted);font-size:13.5px}
details.ex .chev{transition:transform .2s;color:var(--muted)}
details.ex[open] .chev{transform:rotate(90deg)}
details.ex .body{padding:0 18px 18px;display:grid;gap:12px}
.exlist{display:grid;gap:12px}
.welcome{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px}
.welcome h1{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.02em;margin-top:8px}
.welcome h1 em{font-style:normal;background:linear-gradient(90deg,var(--r),var(--t) 40%,var(--c) 70%,var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome .lede{font-size:16.5px;color:var(--muted);margin-top:12px;max-width:52ch}
.wl-r{background:var(--bg);border-radius:16px;padding:16px;display:grid;gap:8px}
.wl-steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
@media (max-width:860px){.welcome{grid-template-columns:1fr;padding:18px}}
.lv-b{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.lv-b.live{background:var(--good);color:var(--surface)}.lv-b.time{background:var(--gold-soft);color:var(--gold)}.lv-b.opt{background:var(--surface-2);color:var(--muted)}
.minin{width:58px;font:inherit;font-size:12.5px;padding:2px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.never{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

textarea,input[type=text]{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical}

.qp{display:flex;flex-wrap:wrap;gap:5px}

.tog{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}

.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--sc,var(--accent)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none;transition:--p .4s}

/* ---------- Cheat ---------- */

.habits{counter-reset:h;display:grid;gap:10px}

.habits div::before{counter-increment:h;content:counter(h);width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.redlines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* ---------- Progress ---------- */
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.rung .lv{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--surface-2);color:var(--muted)}

.rung.cur{border-color:var(--accent);box-shadow:var(--shadow)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1.5px dashed var(--line);border-radius:14px;padding:14px 12px;text-align:center;display:grid;gap:6px;justify-items:center}
.bdg .med{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.bdg b{font-size:14px}
.bdg small{font-size:12px;color:var(--muted);line-height:1.35}
.bdg.got{border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.bdg.got .med{background:var(--gold);color:#fff}
.modprog{display:grid;gap:8px}
.mp{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:14px}
.mp .c{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.mp .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.mp .t i{display:block;height:100%;background:var(--good);border-radius:4px}
.mp .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cert{border-radius:18px;padding:28px;background:linear-gradient(135deg,var(--r-soft),var(--t-soft) 45%,var(--c-soft));border:1px solid var(--line);display:grid;gap:10px;text-align:center;justify-items:center}
.cert h3{font-size:clamp(24px,4vw,34px);font-weight:800}
.cert .nm{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);font-weight:700;border-bottom:2px solid var(--ink);padding:0 24px 4px;min-width:60%}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.statrow{grid-template-columns:1fr 1fr}}

/* ---------- Toast & overlay ---------- */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .3s ease-out}
.toast b{color:var(--gold);font-family:var(--display);font-size:17px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.lvup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(13,19,33,.55);padding:20px}
.lvup .box{background:var(--surface);border-radius:22px;padding:30px 28px;max-width:420px;width:100%;text-align:center;display:grid;gap:10px;justify-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.lvup .big{width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,var(--r),var(--t));color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:40px;font-weight:800}
@keyframes pop{from{transform:scale(.8);opacity:0}}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<header class="hud">
  <div class="wrap hud-in">
    <a class="brand" href="#modules" data-go="modules"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span><b>Workforce Copilot Quest</b><small>Day 1 · Copilot Chat for RM &amp; Global Mobility</small></span></a>
    <div class="meter" aria-live="polite">
      <div class="lvl"><span class="n" id="lvN">Lv 1</span><span class="nm" id="lvName">Prompt Rookie</span></div>
      <div class="bar" role="progressbar" aria-label="Progress to next level" id="xpBar"><i></i></div>
      <div class="xpt" id="xpT"><b id="xpNum">0</b>XP <span id="xpNext">· 100 to Lv 2</span></div>
    </div>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
</header>

<main class="wrap" id="main"></main>

<footer><div class="wrap row" style="justify-content:space-between"><span>Prepared for the Tredence “Copilot for RM &amp; Global Mobility” program · Day 1 · DevPro Academy × UNext</span><span>Progress is saved in this browser only.</span></div></footer>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="lvup" id="lvup" hidden></div>

<script>
/* ================= ICONS ================= */
const I={
 copy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 star:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>',
 info:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
 x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 ok:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 dot:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/></svg>',
 bolt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
 target:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
 layers:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>',
 user:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 steps:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h5v-5h5V9h5V4"/></svg>',
 table:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
 loop:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
 ask:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.8 9.5a2.3 2.3 0 1 1 3.3 2.1c-.7.3-1.1.8-1.1 1.5M12 16h.01"/></svg>',
 shield:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>',
 medal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="14" r="6"/><path d="M8.5 9 6 3h4l2 4 2-4h4l-2.5 6"/></svg>'
};

/* ================= STATE ================= */
const LS='tredence-copilot-quest-day1-v1';
function fresh(){return {v:1,xp:0,ans:{},mods:{},stars:[],saved:[],flags:{},first:0,right:0,wrong:0,name:'',badges:{},team:'rm'}}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.v===1)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

const LEVELS=[
 {xp:0,name:'Prompt Rookie',d:'You know Copilot exists.'},
 {xp:100,name:'Prompt Apprentice',d:'You brief with Role, Task, Context, Format.'},
 {xp:250,name:'Copilot Practitioner',d:'You pick the right prompt type for the job.'},
 {xp:450,name:'Data Power User',d:'You profile, summarise and check data in chat.'},
 {xp:700,name:'Copilot Champion',d:'You verify numbers and hold the guardrails.'},
 {xp:1000,name:'Copilot Trailblazer',d:'The go-to person for Copilot in RM and Mobility.'}
];
function lvIdx(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l.xp)i=k});return i}

/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seededPerm(id,n){let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Spread correct answers evenly across A–D (fixed per question, so letters stay stable between visits)
let MCQ_ORDER=null;
function mcqPerm(q){
  if(q.o.length<3)return q.o.map((_,i)=>i);
  if(!MCQ_ORDER){MCQ_ORDER={};ALLQ().filter(x=>x.type==='mcq'&&x.o.length>2).forEach((x,k)=>{const tgt=[0,2,3,1,1,3,2,0][k%8]%x.o.length;const rest=x.o.map((_,i)=>i).filter(i=>i!==x.a);rest.splice(tgt,0,x.a);MCQ_ORDER[x.id]=rest})}
  return MCQ_ORDER[q.id]||q.o.map((_,i)=>i);
}
function toast(html,ms=2600){const t=el(`<div class="toast">${html}</div>`);$('#toasts').append(t);setTimeout(()=>t.remove(),ms)}
function copyText(text,btn){
  const done=()=>{toast('Copied. Now paste it into Copilot (Ctrl+V) and press Enter.');if(!btn)return;const o=btn.innerHTML;btn.innerHTML=I.ok+' Copied';setTimeout(()=>btn.innerHTML=o,1400)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
  award('first-copy',10,'First prompt copied');
}

/* ================= XP ENGINE ================= */
function award(key,xp,why){
  if(S.flags[key])return false;
  S.flags[key]=1;const before=lvIdx(S.xp);S.xp+=xp;save();
  toast(`<b>+${xp} XP</b><span>${esc(why)}</span>`);
  hud(true);checkBadges();
  const after=lvIdx(S.xp);if(after>before)levelUp(after);
  return true;
}
function hud(bump){
  const i=lvIdx(S.xp),L=LEVELS[i],N=LEVELS[i+1];
  $('#lvN').textContent='Lv '+(i+1);$('#lvName').textContent=L.name;$('#xpNum').textContent=S.xp;
  const pct=N?((S.xp-L.xp)/(N.xp-L.xp))*100:100;
  $('#xpBar i').style.width=pct+'%';$('#xpBar').setAttribute('aria-valuenow',Math.round(pct));
  $('#xpNext').textContent=N?`· ${N.xp-S.xp} to Lv ${i+2}`:'· max level';
  if(bump){const t=$('#xpT');t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')}
  if(current==='progress')renderProgress();
}
function levelUp(i){
  const L=LEVELS[i],box=$('#lvup');
  box.innerHTML=`<div class="box" role="dialog" aria-label="Level up"><div class="big">${i+1}</div><div class="eyebrow">Level up</div><h3 style="font-size:28px">${L.name}</h3><p class="muted">${L.d}</p><button class="btn" id="lvClose">Keep going</button></div>`;
  box.hidden=false;$('#lvClose').focus();$('#lvClose').onclick=()=>box.hidden=true;
  box.onclick=e=>{if(e.target===box)box.hidden=true};
}

/* ================= QUESTIONS ================= */
const QXP={mcq:20,multi:30,tag:40,order:30};
function qShell(q,kind){
  const xp=q.xp||QXP[q.type];
  return el(`<div class="q" data-q="${q.id}"><div class="q-h"><div><div class="kind">${kind}</div><div class="t">${q.q}</div></div><span class="xpb">+${xp} XP</span></div></div>`);
}
function solve(q,node,attempts){
  const xp=q.xp||QXP[q.type],got=attempts===0?xp:Math.max(5,Math.round(xp/2));
  S.ans[q.id]={done:1,first:attempts===0};S.right++;if(attempts===0)S.first++;save();
  node.classList.add('solved');node.querySelector('.xpb').textContent=attempts===0?`+${got} XP earned`:`+${got} XP (2nd try)`;
  award('q:'+q.id,got,attempts===0?'Correct on first try':'Correct');
  const fb=node.querySelector('.fb');fb.className='fb ok show';fb.innerHTML='<b>Correct.</b> '+q.why;
  refreshMeta();
}
function wrongOnce(q,node,msg){
  S.wrong++;save();node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake');
  const fb=node.querySelector('.fb');fb.className='fb no show';fb.innerHTML='<b>Not quite.</b> '+(msg||'Have another go. Half XP is still on the table.');
}
function renderQ(q){
  const solved=S.ans[q.id]&&S.ans[q.id].done;
  let node;
  if(q.type==='mcq'){
    node=qShell(q,q.kind||'Quick check');
    if(q.code)node.append(el(`<div class="stem-code">${esc(q.code)}</div>`));
    const box=el('<div class="opts"></div>');let tries=0;
    mcqPerm(q).forEach((i,pos)=>{const t=q.o[i];
      const b=el(`<button class="opt"><span class="l">${'ABCDE'[pos]}</span><span>${t}</span></button>`);
      if(solved){b.disabled=true;if(i===q.a)b.classList.add('right')}
      b.onclick=()=>{
        if(node.classList.contains('solved'))return;
        if(i===q.a){b.classList.add('right');$$('.opt',box).forEach(x=>x.disabled=true);solve(q,node,tries)}
        else{b.classList.add('wrong');b.disabled=true;tries++;wrongOnce(q,node,q.no&&q.no[i])}
      };box.append(b)});
    node.append(box);
  }
  if(q.type==='multi'){
    node=qShell(q,q.kind||'Select all that apply');
    if(q.code)node.append(el(`<div class="stem-code">${esc(q.code)}</div>`));
    const box=el('<div class="opts"></div>');let tries=0;
    seededPerm(q.id,q.o.length).forEach(i=>{const t=q.o[i];
      const lab=el(`<label class="chk"><input type="checkbox" id="${q.id}-${i}" data-i="${i}"><span>${t}</span></label>`);
      if(solved){lab.querySelector('input').checked=q.a.includes(i);lab.querySelector('input').disabled=true;if(q.a.includes(i))lab.classList.add('right')}
      box.append(lab)});
    const oi=x=>+x.dataset.i;
    const go=el('<div class="row"><button class="btn sm">Check answer</button></div>');
    go.querySelector('button').onclick=()=>{
      if(node.classList.contains('solved'))return;
      const picks=$$('input',box).filter(x=>x.checked).map(oi);
      const ok=picks.length===q.a.length&&picks.every(i=>q.a.includes(i));
      $$('.chk',box).forEach(x=>x.classList.remove('wrong'));
      if(ok){$$('.chk',box).forEach(x=>{const inp=x.querySelector('input');if(q.a.includes(oi(inp)))x.classList.add('right');inp.disabled=true});go.remove();solve(q,node,tries)}
      else{tries++;const off=$$('input',box).filter(x=>x.checked!==q.a.includes(oi(x))).length;wrongOnce(q,node,`${off} ${off===1?'choice is':'choices are'} off. Adjust and check again.`)}
    };
    node.append(box);if(!solved)node.append(go);
  }
  if(q.type==='tag'){
    node=qShell(q,q.kind||'Tag each part');
    const labels=q.labels||['R','T','C','F'];
    if(q.legend)node.append(el(`<div class="legend">${q.legend}</div>`));
    const box=el('<div class="tagrow"></div>');let tries=0;const order=solved?q.items.map((_,i)=>i):shuffle(q.items.map((_,i)=>i));
    order.forEach(i=>{
      const it=q.items[i];
      const row=el(`<div class="tagitem" data-i="${i}"><span>${esc(it[0])}</span><div class="tagbtns">${labels.map(l=>`<button class="tb" data-v="${l}" aria-pressed="false">${l}</button>`).join('')}</div></div>`);
      if(solved){row.classList.add('right');$$('.tb',row).forEach(b=>{b.disabled=true;if(b.dataset.v===it[1])b.setAttribute('aria-pressed','true')})}
      $$('.tb',row).forEach(b=>b.onclick=()=>{if(node.classList.contains('solved'))return;$$('.tb',row).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');row.classList.remove('wrong','right')});
      box.append(row)});
    const go=el('<div class="row"><button class="btn sm">Check tags</button></div>');
    go.querySelector('button').onclick=()=>{
      if(node.classList.contains('solved'))return;
      let bad=0,miss=0;
      $$('.tagitem',box).forEach(r=>{const p=$('.tb[aria-pressed="true"]',r);const want=q.items[+r.dataset.i][1];if(!p){miss++;return}r.classList.toggle('right',p.dataset.v===want);r.classList.toggle('wrong',p.dataset.v!==want);if(p.dataset.v!==want)bad++});
      if(miss){const fb=node.querySelector('.fb');fb.className='fb no show';fb.innerHTML=`Tag all ${q.items.length} lines first (${miss} left).`;return}
      if(!bad){$$('.tb',box).forEach(b=>b.disabled=true);go.remove();solve(q,node,tries)}else{tries++;wrongOnce(q,node,`${bad} ${bad===1?'line is':'lines are'} tagged wrong (in red). Re-tag and check again.`)}
    };
    node.append(box);if(!solved)node.append(go);
  }
  if(q.type==='order'){
    node=qShell(q,q.kind||'Put in order');
    const wrap=el('<div class="ord"><div class="eyebrow">Tap in the right order</div><div class="ord-lane pool" data-empty="All placed."></div><div class="eyebrow">Your sequence</div><div class="ord-lane seq" data-empty="Tap items above to add them here."></div></div>');
    const pool=$('.pool',wrap),seq=$('.seq',wrap);let tries=0;
    const mk=i=>{const b=el(`<button class="chipb" data-i="${i}"><span class="no"></span><span>${esc(q.items[i])}</span></button>`);
      b.onclick=()=>{if(node.classList.contains('solved'))return;$$('.chipb',wrap).forEach(x=>x.classList.remove('wrong','right'));(b.parentElement===pool?seq:pool).append(b);num()};return b};
    const num=()=>{$$('.chipb',pool).forEach(b=>b.querySelector('.no').textContent='');$$('.chipb',seq).forEach((b,k)=>b.querySelector('.no').textContent=k+1)};
    if(solved){q.items.forEach((_,i)=>seq.append(mk(i)));$$('.chipb',seq).forEach(b=>{b.classList.add('right');b.disabled=true});num()}
    else{let o=shuffle(q.items.map((_,i)=>i));if(o.every((v,k)=>v===k))o=o.reverse();o.forEach(i=>pool.append(mk(i)))}
    const go=el('<div class="row"><button class="btn sm">Check order</button><button class="btn sm ghost">Reset</button></div>');
    const [chk,rst]=$$('button',go);
    rst.onclick=()=>{$$('.chipb',seq).forEach(b=>{b.classList.remove('wrong','right');pool.append(b)});num()};
    chk.onclick=()=>{
      if(node.classList.contains('solved'))return;
      const s=$$('.chipb',seq);
      if(s.length<q.items.length){const fb=node.querySelector('.fb');fb.className='fb no show';fb.textContent='Place every item first.';return}
      let bad=0;s.forEach((b,k)=>{const ok=+b.dataset.i===k;b.classList.toggle('right',ok);b.classList.toggle('wrong',!ok);if(!ok)bad++});
      if(!bad){s.forEach(b=>b.disabled=true);go.remove();solve(q,node,tries)}else{tries++;wrongOnce(q,node,`${bad} ${bad===1?'step is':'steps are'} out of place. Tap them to move back and retry.`)}
    };
    node.append(wrap);if(!solved)node.append(go);
  }
  node.append(el('<div class="fb"></div>'));
  if(solved){node.classList.add('solved');node.querySelector('.xpb').textContent='Solved';const fb=node.querySelector('.fb');fb.className='fb ok show';fb.innerHTML='<b>Solved.</b> '+q.why}
  return node;
}

function promptHTML(t){
  // [x] = editable placeholder; ⟦x⟧ = literal brackets shown as-is
  return esc(t).replace(/\[([^\]\n]+)\]/g,(m,x)=>`<span class="ph" contenteditable="true" spellcheck="false" role="textbox" aria-label="Fill in ${x}" data-ph="[${x}]">[${x}]</span>`).replace(/⟦/g,'[').replace(/⟧/g,']');
}
function promptBox(text,label,opts={}){
  const n=el(`<div class="pbox"><div class="pbar"><span class="eyebrow">${label||'Prompt'} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· click the yellow brackets to fill them</span></span><div class="row"><button class="btn sm ghost" data-a="save" title="Save to My Library">${I.star} Save</button><button class="btn sm" data-a="copy">${I.copy} Copy</button></div></div><div class="prompt">${promptHTML(text)}</div></div>`);
  if(!/\[/.test(text.replace(/⟦[^⟧]*⟧/g,'')))$('.pbar .muted',n).remove();
  // Remember placeholder fills per prompt so edits survive tab switches and reloads
  const key=opts.key,phs=$$('.ph',n);
  if(!S.fills)S.fills={};
  if(key&&S.fills[key])phs.forEach((p,k)=>{const v=S.fills[key][k];if(v){p.textContent=v;p.classList.add('filled')}});
  phs.forEach(p=>p.addEventListener('blur',()=>setTimeout(()=>{if(key){S.fills[key]=phs.map(x=>x.classList.contains('filled')?x.textContent:'');save()}},0)));
  $$('.ph',n).forEach(p=>{
    p.addEventListener('focus',()=>{if(!p.classList.contains('filled')){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}});
    p.addEventListener('blur',()=>{const v=p.textContent.trim();if(!v||v===p.dataset.ph){p.textContent=p.dataset.ph;p.classList.remove('filled')}else{p.classList.add('filled');award('first-fill',10,'First placeholder filled')}});
    p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();p.blur()}});
  });
  const get=()=>$('.prompt',n).textContent;
  $('[data-a=copy]',n).onclick=e=>copyText(get(),e.currentTarget);
  const sv=$('[data-a=save]',n);
  if(opts.noSave)sv.remove();else sv.onclick=()=>{S.saved.push({t:opts.title||label||'Saved prompt',p:get(),at:Date.now()});save();sv.innerHTML=I.ok+' Saved';award('first-save',10,'Started your prompt library');checkBadges()};
  return n;
}
function followChips(list){
  const n=el(`<div class="fu"><span class="lab">↻ Follow-ups (click to copy):</span></div>`);
  list.forEach(f=>{const b=el(`<button class="fuchip">${esc(f)}</button>`);b.onclick=()=>copyText(f,null)||toast('Follow-up copied');n.append(b)});return n;
}
function note(txt,warn){return el(`<div class="note ${warn?'warn':''}">${I.info}<span>${txt}</span></div>`)}

function dlCSV(name,text){
  try{const b=new Blob([text],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Downloaded '+esc(name))}
  catch(e){toast('Download blocked. Use the paste sample below.')}
  award('first-dl',10,'Downloaded the sample data');
}
function dataBlock(){
  const d=DATA[TEAM()],lines=d.csv.trim().split('\n'),mini=lines.slice(0,13).join('\n');
  const w=el(`<div class="card tight" style="background:var(--bg);display:grid;gap:10px"><div class="eyebrow">Sample data · fictional · ${TEAM()==='mob'?'Global Mobility':'Resource Management'}</div><div class="row"><button class="btn sm" data-a="dl">Download ${esc(d.label)}</button><span class="muted" style="font-size:13px">${lines.length-1} rows. Attach it in Copilot Chat with the paperclip / “+” button.</span></div><details><summary style="cursor:pointer;font-weight:600;font-size:14px">No attach option? Paste a 12-row sample instead</summary><div style="margin-top:10px"></div></details></div>`);
  $('[data-a=dl]',w).onclick=()=>dlCSV(d.file,d.csv);
  $('details div',w).append(promptBox(mini,'12-row sample · copy and paste it under your prompt',{noSave:true}));
  return w;
}

const SAMPLE=`Hi team, please review the move for Rohan Mehta (EMP ID 305912) from Chennai to Berlin. His passport number is K1234567, current CTC ₹18,20,000, and his appraisal rating was 2 last cycle. He disclosed a medical condition and needs a dependant visa for his spouse. Contact: +91 98765 43210, rohan.mehta@example.com.

Also, for the bench shortlist: prefer young candidates, ideally male and unmarried, who are a good culture fit and don't need visa sponsorship.`;
const PII=[
 ['Email',/[\w.+-]+@[\w-]+\.[\w.]+/g,'[Email]'],
 ['Employee ID',/\b(?:EMP\s?ID|Employee\s?ID|Emp\s?No\.?|EMP)\s*[:#]?\s*\d{4,}/gi,'[Emp ID]'],
 ['Passport-style number',/\b[A-Z]\d{7}\b/g,'[ID number]'],
 ['Immigration detail',/\b(?:dependant visa|visa (?:refusal|rejection)|overstay|immigration status|work permit)\b/gi,'[Immigration detail]'],
 ['Aadhaar-style number',/\b\d{4}\s\d{4}\s\d{4}\b/g,'[ID number]'],
 ['PAN-style number',/\b[A-Z]{5}\d{4}[A-Z]\b/g,'[ID number]'],
 ['Phone number',/(?:\+91[\s-]?)?\b[6-9]\d{4}[\s-]?\d{5}\b/g,'[Phone]'],
 ['Salary / amount',/(?:₹|Rs\.?|INR)\s?[\d,]+(?:\.\d+)?(?:\s?(?:LPA|lakhs?|crores?))?|\b\d+(?:\.\d+)?\s?LPA\b/gi,'[Amount]'],
 ['Health detail',/\b(?:medical condition|medical leave|sick leave|surgery|diagnos\w*|pregnan\w*|disabilit\w*|illness|therapy|hospitali[sz]\w*)\b/gi,'[Health detail]'],
 ['Performance detail',/\b(?:appraisal rating (?:was |of )?\d(?:\/\d)?|rat(?:ed|ing of) \d(?:\/\d)?|PIP|performance improvement plan|underperform\w*)\b/gi,'[Performance detail]'],
 ['Person’s name',/\b(?!(?:Hi|Hello|Dear|Also|Contact|Data|Analyst|The|Please|Her|His|She|He|New|Team)\b)[A-Z][a-z]{2,} (?!(?:ID|JD)\b)[A-Z][a-z]{2,}\b/g,'[Employee]']
];
const BIAS=[
 [/\byoung\b/gi,'Age-coded','Remove, or state the actual job requirement'],
 [/\benergetic\b/gi,'Often age-coded','motivated'],
 [/\b(?:male|female)\b/gi,'Gender used as a criterion','Remove: gender is not a job-related criterion'],
 [/\b(?:un)?married\b/gi,'Marital status used as a criterion','Remove: not job-related'],
 [/\bculture fit\b/gi,'Can screen out difference','values alignment / culture add'],
 [/\b(?:don.?t|do not) need visa sponsorship\b/gi,'Visa status as a screen can be discriminatory','Ask HR or Legal how to handle visa requirements fairly'],
 [/\blocal candidates?\b/gi,'Can proxy for nationality','Describe the location requirement'],
 [/\bnative English speakers?\b/gi,'Excludes fluent non-native speakers','fluent in English'],
 [/\bdigital natives?\b/gi,'Age-coded','comfortable with digital tools'],
 [/\baggressive\b/gi,'Masculine-coded','proactive / driven']
];
function findHits(text,mode){
  const hits=[];
  if(mode==='pii')PII.forEach(([k,re,rep])=>{re.lastIndex=0;let m;while((m=re.exec(text))){hits.push({s:m.index,e:m.index+m[0].length,k,rep,v:m[0]})}});
  else BIAS.forEach(([re,why,alt])=>{re.lastIndex=0;let m;while((m=re.exec(text))){hits.push({s:m.index,e:m.index+m[0].length,k:why,rep:alt,v:m[0]})}});
  hits.sort((a,b)=>a.s-b.s||b.e-a.e);const out=[];let end=-1;hits.forEach(h=>{if(h.s>=end){out.push(h);end=h.e}});return out;
}

    out.innerHTML='';out.append(promptBox(r,'Text with placeholders (demo)',{noSave:true}));tbl.innerHTML=`<p class="muted">${h.length} item${h.length===1?'':'s'} replaced. Pattern matching misses things (for example, first names on their own or free-text health details). This is not de-identification.</p>`;if(h.length)award('tool:anon',20,'Placeholder demo run')};

  const bar=el(`<div class="row" style="justify-content:space-between"><div class="filters" role="group" aria-label="Filter prompts"></div><div class="row"><button class="btn ghost sm" id="cpStar">${I.copy} Copy my prompts</button><button class="btn sm" id="cpAll">${I.copy} Copy all 10</button></div></div>`);
  ['All','Analyse','Report','Verify','Safety','Starred'].forEach(f=>{const b=el(`<button aria-pressed="${f===libF}">${esc(f)}</button>`);b.onclick=()=>{libF=f;go('library',true)};$('.filters',bar).append(b)});
  p.append(bar);
  const g=el('<div class="lib"></div>');
  LIB.filter(x=>libF==='All'||x.c===libF||(libF==='Starred'&&S.stars.includes(x.n))).forEach(x=>{
    const on=S.stars.includes(x.n);
    const c=el(`<div class="lc"><div class="lc-h"><b><span class="n">${x.n}</span>${x.t}</b><div class="row"><span class="cat">${x.c}</span><button class="star" aria-pressed="${on}" aria-label="Star ${x.t}">${I.star}</button></div></div></div>`);
    $('.star',c).onclick=e=>{const b=e.currentTarget;if(S.stars.includes(x.n))S.stars=S.stars.filter(n=>n!==x.n);else S.stars.push(x.n);save();b.setAttribute('aria-pressed',S.stars.includes(x.n));checkBadges()};
    const pb=promptBox(x.p,'Prompt',{noSave:true,key:'lib:'+x.n});c.append(pb);g.append(c)});
  if(!g.children.length)g.append(el('<p class="muted">Nothing starred yet. Tap the star on any prompt.</p>'));
  p.append(g);
  // Apply the viewer's saved placeholder fills, in order, to a template
  const withFills=(t,key)=>{const f=(S.fills&&S.fills[key])||[];let k=0;return t.replace(/\[([^\]\n]+)\]/g,m=>{const v=f[k++];return v||m}).replace(/⟦/g,'[').replace(/⟧/g,']')};
  $('#cpAll',bar).onclick=e=>copyText(LIB.map(x=>`${x.n}. ${x.t}\n${withFills(x.p,'lib:'+x.n)}`).join('\n\n'),e.currentTarget);
  $('#cpStar',bar).onclick=e=>{const s=LIB.filter(x=>S.stars.includes(x.n));if(!s.length&&!S.saved.length){toast('Star or save a prompt first');return}
    copyText([...s.map(x=>`${x.n}. ${x.t}\n${withFills(x.p,'lib:'+x.n)}`),...S.saved.map(v=>`${v.t}\n${withFills(v.p,'sv:'+v.at)}`)].join('\n\n'),e.currentTarget)};
  if(S.saved.length){
    p.append(el(`<div class="sec-h"><div class="eyebrow">Saved during the session</div><h2 style="font-size:24px">Prompts you saved (${S.saved.length})</h2></div>`));
    const sg=el('<div class="lib"></div>');
    S.saved.forEach((s,i)=>{const c=el(`<div class="lc"><div class="lc-h"><b>${esc(s.t)}</b><button class="btn sm ghost">Remove</button></div></div>`);$('.btn',c).onclick=()=>{S.saved.splice(i,1);save();go('library',true)};c.append(promptBox(s.p,'Prompt',{noSave:true,key:'sv:'+s.at}));sg.append(c)});
    p.append(sg);
  }
}

/* ================= RENDER: CHEAT ================= */
function renderCheat(){
  const p=page();
  p.append(el(`<div class="sec-h"><div class="eyebrow">One-page cheat sheet</div><h2>Keep this open next to Copilot</h2></div>`));
  p.append(el(`<div class="card" style="display:grid;gap:14px"><div class="eyebrow">The formula</div><div class="formula"><span style="background:var(--r-soft);color:var(--r)">Role</span><span class="ar">→</span><span style="background:var(--t-soft);color:var(--t)">Task</span><span class="ar">→</span><span style="background:var(--c-soft);color:var(--c)">Context</span><span class="ar">→</span><span style="background:var(--f-soft);color:var(--f)">Format</span></div></div>`));
  const tpl=el('<div class="card" style="display:grid;gap:12px"><div class="eyebrow">Blank template</div></div>');
  tpl.append(promptBox('Act as [ROLE].\n[TASK — one clear verb: draft / rewrite / summarise / convert / generate].\nContext: [audience, purpose, constraints, tone, anything Copilot can\'t guess].\nFormat: [structure, length, headings, table, bullet points, language level].','Template',{title:'Blank RTCF template'}));
  const two=el('<div class="grid2"></div>');
  two.append(el(`<div class="card" style="display:grid;gap:14px;align-content:start"><div class="eyebrow">Five habits that fix 80% of bad outputs</div><div class="habits"><div>Say <b>who</b> Copilot is (role) and <b>who</b> the output is for (audience).</div><div>Give the constraints: length, tone, must-include, must-avoid.</div><div>Specify the shape: table, bullets, headings, word count.</div><div>Iterate in the same chat: “shorter”, “more formal”, “add an example”.</div><div>Ask it to flag assumptions and anything to verify.</div></div></div>`));
  const fu=el(`<div class="card" style="display:grid;gap:14px;align-content:start"><div class="eyebrow">Magic follow-ups · click to copy</div><div class="fu"></div></div>`);
  FOLLOWS.forEach(f=>{const b=el(`<button class="fuchip">↻ ${esc(f)}</button>`);b.onclick=()=>{copyText(f,null);toast('Follow-up copied')};$('.fu',fu).append(b)});two.append(fu);
  p.append(tpl,two);
  p.append(el(`<div style="display:grid;gap:12px"><div class="eyebrow">Three red lines</div><div class="redlines"><div><b>No personal data</b>No personal or confidential data in Copilot Chat, and Tredence’s data rules apply in every tool.</div><div><b>No AI decisions</b>No AI-made people decisions. A human decides.</div><div><b>No unchecked facts</b>Verify dates, numbers, laws and policy references.</div></div></div>`));
}

/* ================= RENDER: PROGRESS ================= */
function renderProgress(){
  if(current!=='progress')return;
  $('#main').innerHTML='';const p=page();
  const all=ALLQ(),solved=all.filter(q=>done(q.id)).length,acc=S.right+S.wrong?Math.round(S.right/(S.right+S.wrong)*100):0;
  const i=lvIdx(S.xp);
  p.append(el(`<div class="sec-h"><div class="eyebrow">Level &amp; progression</div><h2>Lv ${i+1} · ${LEVELS[i].name}</h2><p>${LEVELS[i].d}</p></div>`));
  p.append(el(`<div class="statrow"><div class="stat"><b style="color:var(--gold)">${S.xp}</b><span>total XP</span></div><div class="stat"><b>${solved}/${all.length}</b><span>challenges solved</span></div><div class="stat"><b>${acc}%</b><span>answer accuracy</span></div><div class="stat"><b>${Object.keys(S.badges).length}/${BADGES.length}</b><span>badges</span></div></div>`));
  const two=el('<div class="grid2"></div>');
  const lad=el('<div class="card" style="display:grid;gap:12px;align-content:start"><div class="eyebrow">Level ladder</div><div class="ladder"></div></div>');
  LEVELS.slice().reverse().forEach((L,k)=>{const idx=LEVELS.length-1-k;$('.ladder',lad).append(el(`<div class="rung ${S.xp>=L.xp?'got':''} ${idx===i?'cur':''}"><span class="lv">${idx+1}</span><span><b>${L.name}</b><small>${L.d}</small></span><span class="req">${L.xp} XP</span></div>`))});
  const mp=el('<div class="card" style="display:grid;gap:12px;align-content:start"><div class="eyebrow">Module progress</div><div class="modprog"></div></div>');
  const groups=[{c:'Lab',t:'Prompt Lab',qs:[...ANATOMY,...TYPES.flatMap(t=>t.qs)]},...MODS.filter(m=>!m.brk).map(m=>({c:m.c,t:m.t,qs:m.qs,id:m.id}))];
  groups.forEach(g=>{const d=g.qs.filter(q=>done(q.id)).length,pct=g.qs.length?d/g.qs.length*100:0;$('.modprog',mp).append(el(`<div class="mp"><span class="c">${g.c}</span><span><span style="font-size:13.5px;display:block">${g.t}${g.id&&S.mods[g.id]?' <span style="color:var(--good)">· complete</span>':''}</span><span class="t"><i style="width:${pct}%"></i></span></span><span class="v">${d}/${g.qs.length}</span></div>`))});
  two.append(lad,mp);p.append(two);
  const bd=el('<div class="card" style="display:grid;gap:14px"><div class="eyebrow">Badges · +25 XP each</div><div class="badges"></div></div>');
  BADGES.forEach(b=>$('.badges',bd).append(el(`<div class="bdg ${S.badges[b.id]?'got':''}"><span class="med">${I.medal}</span><b>${b.nm}</b><small>${b.d}</small></div>`)));
  p.append(bd);
  const cert=el(`<div class="cert"><div class="eyebrow">My session progress card · self-reported, not a certification</div><h3>Copilot for Workforce &amp; Mobility Ops · Day 1</h3><p class="muted">Progress in the practice companion for</p><div class="nm" id="certName">${esc(S.name||'Your name')}</div><p>practice level <b>Lv ${i+1} · ${LEVELS[i].name}</b> with <b>${S.xp} XP</b> and <b>${Object.keys(S.badges).length}</b> badge${Object.keys(S.badges).length===1?'':'s'}.</p><p class="muted" style="font-size:13px">${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} · DevPro Academy × UNext for Tredence</p><div class="row" style="justify-content:center;max-width:360px;width:100%"><input type="text" id="nameIn" placeholder="Type your name for the certificate" value="${esc(S.name)}" aria-label="Your name"></div><p class="muted" style="font-size:12.5px">Take a screenshot to share it.</p></div>`);
  $('#nameIn',cert).addEventListener('input',e=>{S.name=e.target.value;save();$('#certName').textContent=S.name||'Your name'});
  p.append(cert);
  const rs=el(`<div class="row" style="justify-content:flex-end"><button class="btn ghost sm" id="rst">Reset my progress</button></div>`);
  $('#rst',rs).onclick=()=>{rs.innerHTML='<span class="muted">This clears XP, answers, badges and saved prompts in this browser.</span><button class="btn sm" id="rsY" style="background:var(--bad);color:#fff">Yes, reset</button><button class="btn ghost sm" id="rsN">Cancel</button>';$('#rsY').onclick=()=>{S=fresh();save();hud();go('progress')};$('#rsN').onclick=()=>go('progress',true)};
  p.append(rs);
}

/* ================= BOOT ================= */
buildTabs();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lvup').hidden=true});
const start=(location.hash||'').slice(1);
hud();go(TABS.some(t=>t[0]===start)?start:'modules',true);
</script>
